<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claymates — пластилиновые 3D-персонажи</title>
  <meta name="description" content="Конструктор объёмных пластилиновых 3D-персонажей: форма, эмоции, аксессуары и готовые анимации." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path fill='%235b5cf0' d='M20 4C25 11 33 17 33 25a13 13 0 0 1-26 0C7 17 15 11 20 4Z'/><circle cx='16' cy='25' r='2.4'/><circle cx='24' cy='25' r='2.4'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    /* intro: until the character is in place only the stage is visible (applies before the app CSS loads) */
    body.intro #panel, body.intro .presets-wrap, body.intro .stage-dock, body.intro .about { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="intro">
  <div id="app">
    <main id="stage">
      <canvas id="c"></canvas>


      <div class="presets-wrap"><div class="presets" id="presets"></div></div>

      <div class="stage-dock"><div class="stagebar" id="stagebar"></div><div id="export-menu"></div></div>
      <div id="toast"></div>

      <div class="about">
        <button class="about-btn" type="button" aria-label="О проекте" aria-describedby="about-tip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".4" fill="currentColor"/></svg>
        </button>
        <div class="about-tip" id="about-tip" role="tooltip">
          <b>Claymates</b>
          <p>Конструктор объёмных 3D-персонажей: форма, материал, эмоции, аксессуары и готовые анимации. Результат можно скачать как PNG с прозрачным фоном или зацикленное видео.</p>
          <div class="about-links">
            <a href="https://hereisalex.art/" target="_blank" rel="noopener">Разработчик</a>
            <a href="https://github.com/adentxxx/Squish-Animated-Characters" target="_blank" rel="noopener">GitHub</a>
          </div>
        </div>
      </div>
    </main>

    <aside id="panel">
      <nav class="tabs" id="tabs"></nav>
      <div id="controls"></div>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
